name: package-ihs-handle-server

on: workflow_dispatch

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./image/ihs-handle-server
          dockerfile: ./image/ihs-handle-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ihs-handle-server:latest
            ghcr.io/${{ github.repository_owner }}/ihs-handle-server:${{ github.sha }}
